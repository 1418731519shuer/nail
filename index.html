<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>美甲系统</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fdf6f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    h1 {
      font-size: 2rem;
      color: #c97b84;
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
    }
    p {
      color: #999;
      margin-bottom: 3rem;
      font-size: 0.95rem;
    }
    .cards {
      display: flex;
      gap: 2rem;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 200px;
      height: 200px;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-decoration: none;
      color: #333;
      transition: transform 0.2s, box-shadow 0.2s;
      gap: 1rem;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.13);
    }
    .card .icon { font-size: 3rem; }
    .card .label { font-size: 1.1rem; font-weight: 600; }
    .card .desc { font-size: 0.8rem; color: #aaa; }
  </style>
</head>
<body>
  <h1>美甲试戴系统</h1>
  <p>请选择进入的端口</p>
  <div class="cards">
    <a class="card" href="/user/">
      <div class="icon">💅</div>
      <div class="label">用户端</div>
      <div class="desc">指甲试戴体验</div>
    </a>
    <a class="card" href="/yunying/">
      <div class="icon">🛠️</div>
      <div class="label">运营端</div>
      <div class="desc">内容管理后台</div>
    </a>
  </div>
<script>(function(){try{fetch("/api/beacon",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({page:location.pathname}),keepalive:true});}catch(e){}})();</script>
</body>
</html>
