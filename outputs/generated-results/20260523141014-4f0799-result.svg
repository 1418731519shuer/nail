  <g filter="url(#shadow)">
    <rect x="64" y="150" width="380" height="430" rx="22" fill="#ffffff"/>
    <image href="/uploads/user-hands/20260523141014-4f0799-hand.png" x="84" y="170" width="340" height="340" preserveAspectRatio="xMidYMid slice"/>
    <text x="84" y="548" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#3b2b27">用户手图</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="516" y="150" width="380" height="430" rx="22" fill="#ffffff"/>
    <image href="/uploads/nail-styles/20260523141014-4f0799-style.jpg" x="536" y="170" width="340" height="340" preserveAspectRatio="xMidYMid slice"/>
    <text x="536" y="548" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#3b2b27">粉橘薄荷渐变</text>
  </g>
  <rect x="300" y="612" width="360" height="54" rx="27" fill="#2f211d"/>
  <text x="480" y="647" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fffaf5">Mock Try-On · 可接真实 API</text>
